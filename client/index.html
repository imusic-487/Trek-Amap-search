<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style data-trek-ui>
/* TREK plugin design kit — token-driven, matches the host in light + dark. */
:root {
  color-scheme: light;
  /* Live tokens (the host overrides these per theme/accent via the bridge). */
  --bg-primary: #ffffff; --bg-secondary: #f8fafc; --bg-tertiary: #f1f5f9;
  --bg-card: #ffffff; --bg-input: #ffffff; --bg-hover: rgba(0,0,0,.03); --bg-selected: #e2e8f0;
  --text-primary: #111827; --text-secondary: #374151; --text-muted: #6b7280; --text-faint: #9ca3af;
  --border-primary: #e5e7eb; --border-secondary: #f3f4f6; --border-faint: rgba(0,0,0,.06);
  --accent: #111827; --accent-text: #ffffff; --accent-hover: #1f2937; --accent-subtle: #f1f5f9;
  --success: #16a34a; --success-soft: #dcfce7; --danger: #dc2626; --danger-soft: #fef2f2;
  --warning: #d97706; --warning-soft: #fffbeb; --info: #2563eb; --info-soft: #eff6ff;
  --shadow-card: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
  --shadow-sm: 0 1px 2px rgba(0,0,0,.05); --shadow-md: 0 4px 12px rgba(0,0,0,.08);
  --shadow-lg: 0 12px 32px rgba(0,0,0,.12);
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-xl: 20px;
  --font-system: 'Poppins', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
  /* Baked glass layer (mirrors the host's .trek-dash; not sent over the bridge). */
  --glass-bg: linear-gradient(135deg, oklch(1 0 0 / .72) 0%, oklch(0.99 0.006 75 / .5) 100%);
  --glass-border: oklch(0.88 0.008 70 / .7);
  --glass-shadow: 0 1px 2px oklch(0.4 0.02 60 / .05), 0 12px 32px -14px oklch(0.3 0.02 60 / .2);
  --glass-shadow-hover: 0 2px 6px oklch(0.4 0.02 60 / .07), 0 26px 56px -20px oklch(0.25 0.04 60 / .32);
  --glass-highlight: inset 0 1px 0 oklch(1 0 0 / .8);
  --glass-blur: blur(22px) saturate(1.7);
  --r-sm: 14px; --r-md: 18px; --r-lg: 22px; --r-xl: 28px;
  /* The house easings: a punchy card curve and TREK's ease-out-quint. */
  --trek-ease: cubic-bezier(.2,.7,.2,1);
  --trek-ease-quint: cubic-bezier(.23,1,.32,1);
}
[data-theme="dark"] {
  color-scheme: dark;
  --bg-primary: #121215; --bg-secondary: #1a1a1e; --bg-tertiary: #1c1c21;
  --bg-card: #131316; --bg-input: #1c1c21; --bg-hover: rgba(255,255,255,.06); --bg-selected: rgba(255,255,255,.1);
  --text-primary: #f4f4f5; --text-secondary: #d4d4d8; --text-muted: #a1a1aa; --text-faint: #71717a;
  --border-primary: #27272a; --border-secondary: #1c1c21; --border-faint: rgba(255,255,255,.07);
  --accent: #e4e4e7; --accent-text: #09090b; --accent-hover: #d4d4d8; --accent-subtle: rgba(255,255,255,.08);
  --success: #22c55e; --success-soft: rgba(34,197,94,.15); --danger: #ef4444; --danger-soft: rgba(239,68,68,.15);
  --warning: #f59e0b; --warning-soft: rgba(245,158,11,.15); --info: #3b82f6; --info-soft: rgba(59,130,246,.15);
  --shadow-card: 0 1px 3px rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.3);
  --shadow-sm: 0 1px 2px rgba(0,0,0,.3); --shadow-md: 0 4px 12px rgba(0,0,0,.4);
  --shadow-lg: 0 12px 32px rgba(0,0,0,.5);
  --glass-bg: linear-gradient(135deg, oklch(0.31 0 0 / .58) 0%, oklch(0.25 0 0 / .42) 100%);
  --glass-border: oklch(1 0 0 / .1);
  --glass-shadow: 0 1px 2px oklch(0 0 0 / .3), 0 12px 32px -14px oklch(0 0 0 / .55);
  --glass-shadow-hover: 0 2px 6px oklch(0 0 0 / .4), 0 26px 56px -20px oklch(0 0 0 / .72);
  --glass-highlight: inset 0 1px 0 oklch(1 0 0 / .09);
}

/* Base: a light reset + native type. The bootstrap adds `trek-ui` to <body>. */
*, *::before, *::after { box-sizing: border-box; }
body.trek-ui {
  margin: 0;
  font-family: var(--font-system);
  font-size: 14px;
  line-height: 1.5;
  color: var(--text-primary);
  background: transparent;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
.trek-ui :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* Cards + panels ----------------------------------------------------------- */
.trek-card {
  background: var(--bg-card);
  border: 1px solid var(--border-primary);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  padding: 16px;
}
.trek-glass {
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: var(--r-xl);
  box-shadow: var(--glass-shadow), var(--glass-highlight);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  padding: 24px 26px;
}
/* Add to a card/glass to make it lift on hover, like a native tool tile. */
.trek-interactive {
  transition: transform .3s var(--trek-ease), box-shadow .3s, border-color .3s;
  cursor: pointer;
}
.trek-glass.trek-interactive:hover {
  transform: translateY(-2px);
  box-shadow: var(--glass-shadow-hover), var(--glass-highlight);
}
.trek-card.trek-interactive:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.trek-interactive:active { transform: translateY(0); }

/* Buttons ------------------------------------------------------------------ */
.trek-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 16px; border-radius: 12px;
  font: inherit; font-size: 14px; font-weight: 500; line-height: 1;
  border: 1px solid transparent; cursor: pointer; text-decoration: none; white-space: nowrap;
  transition: transform .08s var(--trek-ease-quint), background .15s, box-shadow .15s, border-color .15s, color .15s;
}
.trek-btn:active { transform: scale(.97); }
.trek-btn:disabled { opacity: .5; cursor: not-allowed; }
.trek-btn--primary { background: var(--accent); color: var(--accent-text); box-shadow: var(--shadow-sm); }
.trek-btn--primary:hover:not(:disabled) { background: var(--accent-hover); }
.trek-btn--secondary { background: var(--bg-card); color: var(--text-primary); border-color: var(--border-primary); box-shadow: var(--shadow-sm); }
.trek-btn--secondary:hover:not(:disabled) { background: var(--bg-hover); }
.trek-btn--ghost { background: transparent; color: var(--text-secondary); }
.trek-btn--ghost:hover:not(:disabled) { background: var(--bg-hover); color: var(--text-primary); }
.trek-btn--danger { background: var(--danger); color: #fff; }
.trek-btn--danger:hover:not(:disabled) { filter: brightness(1.05); }

/* Form controls ------------------------------------------------------------ */
.trek-input, .trek-textarea, .trek-select {
  width: 100%; box-sizing: border-box;
  padding: 8px 14px; border-radius: 10px;
  border: 1px solid var(--border-primary); background: var(--bg-input); color: var(--text-primary);
  font: inherit; font-size: 13px; outline: none;
  transition: border-color .15s, box-shadow .15s, background .15s;
}
.trek-textarea { resize: vertical; min-height: 72px; }
.trek-input::placeholder, .trek-textarea::placeholder { color: var(--text-faint); }
.trek-input:focus, .trek-textarea:focus, .trek-select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in oklch, var(--accent) 22%, transparent);
}
.trek-label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }

/* Enhanced select — the kit upgrades a native <select> into this listbox so the
   dropdown matches the host (a native popup is drawn by the OS and can't be
   themed). The real <select> stays in the DOM as the value source. */
.trek-select-wrap { position: relative; }
.trek-select-native-hidden {
  position: absolute !important; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); border: 0;
}
.trek-select-trigger {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  text-align: start; cursor: pointer;
}
.trek-select-trigger:disabled { opacity: .5; cursor: not-allowed; }
.trek-select-trigger[aria-expanded="true"] {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in oklch, var(--accent) 22%, transparent);
}
.trek-select-value { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trek-select-caret { flex: none; display: inline-flex; color: var(--text-faint); transition: transform .15s; }
.trek-select-trigger[aria-expanded="true"] .trek-select-caret { transform: rotate(180deg); }
.trek-select-menu {
  position: absolute; left: 0; right: 0; top: 100%; z-index: 50;
  margin-top: 6px; padding: 4px;
  max-height: 260px; overflow-y: auto;
  background: var(--bg-card); color: var(--text-primary);
  border: 1px solid var(--border-primary); border-radius: 10px;
  box-shadow: var(--shadow-md);
}
.trek-select-menu[data-placement="top"] { top: auto; bottom: 100%; margin-top: 0; margin-bottom: 6px; }
.trek-select-option {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; border-radius: 7px; cursor: pointer;
  font-size: 13px; white-space: nowrap;
}
.trek-select-option.trek-active { background: var(--bg-hover); }
.trek-select-option[aria-selected="true"] { color: var(--accent); font-weight: 600; }
.trek-select-option[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }

/* Chips + badges ----------------------------------------------------------- */
.trek-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 999px;
  font-size: 12px; font-weight: 600; white-space: nowrap;
  color: var(--text-secondary); background: var(--accent-subtle);
}
.trek-chip--accent  { color: var(--accent);  background: color-mix(in oklch, var(--accent) 12%, transparent); }
.trek-chip--success { color: var(--success); background: var(--success-soft); }
.trek-chip--danger  { color: var(--danger);  background: var(--danger-soft); }
.trek-chip--warning { color: var(--warning); background: var(--warning-soft); }
.trek-chip--info    { color: var(--info);    background: var(--info-soft); }

/* Rows + text helpers ------------------------------------------------------ */
.trek-row {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px; border-radius: 12px; cursor: pointer;
  transition: background .12s;
}
.trek-row:hover { background: var(--bg-hover); }
.trek-title { font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: .14em; color: var(--text-muted); }
.trek-muted { color: var(--text-muted); }
.trek-faint { color: var(--text-faint); }

/* Layout helpers ----------------------------------------------------------- */
.trek-stack { display: flex; flex-direction: column; gap: 12px; }
.trek-cluster { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }

/* Motion library — the host's animation vocabulary, mirrored 1:1 from
   index.css so plugin UI moves exactly like TREK does. ---------------------- */
@keyframes trek-menu-enter {
  from { opacity: 0; transform: scale(0.95) translateY(-4px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}
@keyframes trek-popover-enter {
  from { opacity: 0; transform: scale(0.96); }
  to   { opacity: 1; transform: scale(1); }
}
@keyframes trek-modal-enter {
  from { opacity: 0; transform: scale(0.97); }
  to   { opacity: 1; transform: scale(1); }
}
@keyframes trek-backdrop-enter {
  from { opacity: 0; }
  to   { opacity: 1; }
}
@keyframes trek-toast-enter {
  from { opacity: 0; transform: translateY(8px) scale(0.96); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes trek-progress-fill {
  from { width: 0%; }
  to   { width: var(--trek-progress-to, 0%); }
}
@keyframes trek-pie-reveal {
  from { opacity: 0; transform: rotate(-90deg) scale(0.85); }
  to   { opacity: 1; transform: rotate(0deg) scale(1); }
}
@keyframes trek-bar-fill {
  from { transform: scaleX(0); }
  to   { transform: scaleX(1); }
}
@keyframes trek-page-enter {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes trek-shimmer {
  from { background-position: -200% 0; }
  to   { background-position: 200% 0; }
}
@keyframes trek-drawer-enter {
  from { opacity: 0; transform: translateY(100%); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes trek-fade-up {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
.trek-menu-enter {
  animation: trek-menu-enter 200ms var(--trek-ease-quint);
  transform-origin: top right; will-change: transform, opacity;
}
.trek-menu-enter-left {
  animation: trek-menu-enter 200ms var(--trek-ease-quint);
  transform-origin: top left; will-change: transform, opacity;
}
.trek-popover-enter { animation: trek-popover-enter 180ms var(--trek-ease-quint); will-change: transform, opacity; }
.trek-modal-enter { animation: trek-modal-enter 220ms var(--trek-ease-quint); will-change: transform, opacity; }
@media (max-width: 639px) {
  .trek-modal-enter { animation: trek-drawer-enter 320ms cubic-bezier(0.32, 0.72, 0, 1); }
}
.trek-backdrop-enter { animation: trek-backdrop-enter 180ms var(--trek-ease-quint); }
.trek-toast-enter { animation: trek-toast-enter 260ms var(--trek-ease-quint); will-change: transform, opacity; }
.trek-pie-reveal {
  animation: trek-pie-reveal 900ms var(--trek-ease-quint) both;
  transform-origin: center; will-change: transform, opacity;
}
.trek-bar-fill {
  animation: trek-bar-fill 700ms var(--trek-ease-quint) both;
  transform-origin: left center; will-change: transform;
}
.trek-page-enter { animation: trek-page-enter 220ms var(--trek-ease-quint) both; }
.trek-skeleton {
  background: linear-gradient(90deg, var(--bg-tertiary) 0%, var(--bg-hover) 50%, var(--bg-tertiary) 100%);
  background-size: 200% 100%;
  animation: trek-shimmer 1.6s linear infinite;
  border-radius: 8px; color: transparent; user-select: none;
}
[data-theme="dark"] .trek-skeleton {
  background: linear-gradient(90deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 100%);
  background-size: 200% 100%;
}
.trek-stagger > * { animation: trek-fade-up 280ms var(--trek-ease-quint) both; }
.trek-stagger > *:nth-child(1) { animation-delay: 0ms; }
.trek-stagger > *:nth-child(2) { animation-delay: 40ms; }
.trek-stagger > *:nth-child(3) { animation-delay: 80ms; }
.trek-stagger > *:nth-child(4) { animation-delay: 120ms; }
.trek-stagger > *:nth-child(5) { animation-delay: 160ms; }
.trek-stagger > *:nth-child(6) { animation-delay: 200ms; }
.trek-stagger > *:nth-child(7) { animation-delay: 240ms; }
.trek-stagger > *:nth-child(8) { animation-delay: 280ms; }
.trek-stagger > *:nth-child(n+9) { animation-delay: 320ms; }

/* Accessibility: mirror the host's own graceful-degrade rules. -------------- */
[data-no-transparency] .trek-glass {
  background: var(--bg-card); border-color: var(--border-primary);
  box-shadow: var(--shadow-card);
  -webkit-backdrop-filter: none; backdrop-filter: none;
}
[data-reduce-motion] .trek-interactive,
[data-reduce-motion] .trek-btn,
[data-reduce-motion] .trek-row { transition: none; }
[data-reduce-motion] .trek-interactive:hover,
[data-reduce-motion] .trek-btn:active { transform: none; }
[data-reduce-motion] .trek-menu-enter, [data-reduce-motion] .trek-menu-enter-left,
[data-reduce-motion] .trek-popover-enter, [data-reduce-motion] .trek-modal-enter,
[data-reduce-motion] .trek-toast-enter, [data-reduce-motion] .trek-stagger > *,
[data-reduce-motion] .trek-page-enter {
  animation: trek-backdrop-enter 120ms ease-out;
}
[data-reduce-motion] .trek-pie-reveal, [data-reduce-motion] .trek-bar-fill {
  animation: trek-backdrop-enter 120ms ease-out both;
}
[data-reduce-motion] .trek-skeleton { animation: none; background: var(--bg-tertiary); }
[data-reduce-motion] .trek-select-caret { transition: none; }
@media (prefers-reduced-motion: reduce) {
  .trek-interactive, .trek-btn, .trek-row, .trek-input, .trek-textarea, .trek-select, .trek-select-caret { transition: none; }
  .trek-interactive:hover, .trek-btn:active { transform: none; }
  .trek-menu-enter, .trek-menu-enter-left, .trek-popover-enter,
  .trek-modal-enter, .trek-toast-enter, .trek-stagger > *, .trek-page-enter {
    animation: trek-backdrop-enter 120ms ease-out;
  }
  .trek-pie-reveal, .trek-bar-fill { animation: trek-backdrop-enter 120ms ease-out both; }
  .trek-skeleton { animation: none; background: var(--bg-tertiary); }
}
</style>
<script data-trek-ui>
(function () {
  'use strict';
  var docEl = document.documentElement;
  var ctxHandlers = [];
  var evtHandlers = [];
  var lastCtx = null;
  var pending = {};
  var pendingConfirms = {};
  var seq = 0;
  var lastH = -1;

  function send(msg) { try { window.parent.postMessage(msg, '*'); } catch (e) {} }
  function setFlag(name, on) { if (on) { docEl.setAttribute(name, ''); } else { docEl.removeAttribute(name); } }

  function applyContext(m) {
    if (m.theme) { docEl.setAttribute('data-theme', m.theme); }
    if (m.locale) { docEl.setAttribute('lang', m.locale); }
    docEl.setAttribute('dir', m.dir === 'rtl' ? 'rtl' : 'ltr');
    var t = m.tokens || {};
    for (var k in t) {
      if (Object.prototype.hasOwnProperty.call(t, k) && t[k]) { docEl.style.setProperty(k, t[k]); }
    }
    var a = m.appearance || {};
    setFlag('data-reduce-motion', a.reducedMotion);
    setFlag('data-no-transparency', a.noTransparency);
    if (a.density) { docEl.setAttribute('data-density', a.density); }
    if (a.scheme) { docEl.setAttribute('data-scheme', a.scheme); }
    if (document.body) { document.body.classList.add('trek-ui'); }
  }

  function reportHeight() {
    var h = Math.ceil(document.documentElement.scrollHeight);
    if (h > 0 && h !== lastH) { lastH = h; send({ type: 'trek:resize', height: h }); }
  }

  window.addEventListener('message', function (ev) {
    // Opaque frame: origin serialises to 'null', so trust the SENDER — only our real
    // parent window. Never act on a claimed id or on origin.
    if (ev.source !== window.parent) { return; }
    var m = ev.data;
    if (!m || typeof m !== 'object') { return; }
    if (m.type === 'trek:context') {
      lastCtx = m; api.context = m;
      applyContext(m);
      for (var i = 0; i < ctxHandlers.length; i++) { try { ctxHandlers[i](m); } catch (e) {} }
      reportHeight();
    } else if (m.type === 'trek:response') {
      var p = pending[m.requestId];
      if (p) { delete pending[m.requestId]; p.resolve(m.data); }
    } else if (m.type === 'trek:error') {
      var q = pending[m.requestId];
      if (q) { delete pending[m.requestId]; var err = new Error(m.message || 'invoke failed'); err.code = m.code; q.reject(err); }
    } else if (m.type === 'trek:confirm:result') {
      var c = pendingConfirms[m.requestId];
      if (c) { delete pendingConfirms[m.requestId]; c(!!m.confirmed); }
    } else if (m.type === 'trek:event') {
      for (var j = 0; j < evtHandlers.length; j++) { try { evtHandlers[j](m.event, m.tripId); } catch (e) {} }
    }
  });

  // Native DOM helpers so a widget can build kit-styled UI with no bundler and no
  // hand-written CSS — every element carries the same trek-* classes the kit ships.
  function mkEl(tag, props, children) {
    var node = document.createElement(tag);
    props = props || {};
    for (var k in props) {
      if (!Object.prototype.hasOwnProperty.call(props, k)) { continue; }
      var v = props[k];
      if (v == null) { continue; }
      if (k === 'class' || k === 'className') { node.className = v; }
      else if (k === 'text') { node.textContent = v; }
      else if (k === 'html') { node.innerHTML = v; }
      else if (k === 'on') { for (var ev in v) { if (Object.prototype.hasOwnProperty.call(v, ev)) { node.addEventListener(ev, v[ev]); } } }
      else { node.setAttribute(k, v); }
    }
    var kids = children == null ? [] : (typeof children === 'string' || children.nodeType ? [children] : children);
    for (var i = 0; i < kids.length; i++) {
      var c = kids[i];
      if (c == null) { continue; }
      node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    }
    return node;
  }
  var ui = {
    el: mkEl,
    button: function (label, opts) {
      opts = opts || {};
      return mkEl('button', { class: 'trek-btn' + (opts.variant ? ' trek-btn--' + opts.variant : ''), type: 'button', text: label, on: opts.onClick ? { click: opts.onClick } : null }, null);
    },
    card: function (children) { return mkEl('div', { class: 'trek-card' }, children); },
    chip: function (text, variant) { return mkEl('span', { class: 'trek-chip' + (variant ? ' trek-chip--' + variant : ''), text: text }, null); },
    input: function (opts) { opts = opts || {}; return mkEl('input', { class: 'trek-input', type: opts.type || 'text', placeholder: opts.placeholder || '', value: opts.value || '' }, null); },
    mount: function (node, target) { (target || document.body).appendChild(node); return node; }
  };

  var api = {
    context: null,
    ui: ui,
    ready: function () { send({ type: 'trek:ready' }); },
    requestContext: function () { send({ type: 'trek:context:request' }); },
    onContext: function (cb) {
      ctxHandlers.push(cb);
      if (lastCtx) { try { cb(lastCtx); } catch (e) {} }
      return function () { var i = ctxHandlers.indexOf(cb); if (i >= 0) { ctxHandlers.splice(i, 1); } };
    },

      else if (k === 'ArrowUp') { e.preventDefault(); highlight(nextEnabled(activeIdx, -1)); }
      else if (k === 'Home') { e.preventDefault(); highlight(nextEnabled(-1, 1)); }
      else if (k === 'End') { e.preventDefault(); highlight(nextEnabled(0, -1)); }
      else if (k === 'Enter' || k === ' ' || k === 'Spacebar') { e.preventDefault(); commit(activeIdx); }
      else if (k === 'Tab') { closeMenu(); }

    menu.addEventListener('mousedown', function (e) { e.preventDefault(); }); // keep focus on the trigger
    menu.addEventListener('click', function (e) {

    <div class="trek-card" style="max-width: 720px; margin: 0 auto; padding: 16px">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:8px">
        <h2 class="trek-h2" style="margin-top: 0">🗺️ 找地方</h2>

        <button id="btn-coord-fix" class="trek-btn trek-btn--secondary" style="flex:none; font-size:12px; padding:6px 10px" title="重新扫描行程已有地点，修复坐标偏移">🛠️ 修复坐标</button>
      </div>

      <!-- v1.4.0: 坐标修复面板——扫描行程已有地点，逐个重新搜索高德比对新旧坐标，预览确认后才写入 -->

        </div>

      <div style="font-size:11px; opacity:0.65; margin-top:8px">💡 城市自动识别可手动改 · 搜索后可按类型筛选、按评分排序 · 添加后高德链接自动存入「网站」</div>

      </div>

      <div style="margin-top: 14px; padding: 8px 12px; font-size: 12px; opacity: 0.6; border-top: 1px solid var(--trek-border, rgba(128,128,128,0.25))">
        💡 补充官网/小红书/抖音等链接：编辑地点「备注」，一行一个。
        <span id="key-hint" style="display:none">🔑 还没有 Key？<a href="https://lbs.amap.com/api/webservice/guide/create-project/get-key" target="_blank" rel="noopener" style="color:var(--trek-info,#2563eb)">前往高德开放平台申请</a>（选择「Web 服务」类型），个人开发者配额 50 万次/天。</span>  <!-- v1.3.25: key-hint 加真实链接 -->
      </div>
    </div>

    <script>
      // 高德搜索插件 UI - trip-page 类型：显示在当前行程顶部导航，context 自带 tripId
      let tripId = null
      let lastTripId = null    // v1.3.6: 主题切换也触发 onContext，但只有 tripId 变化才刷新列表（防闪烁重载）
      let currentPois = []       // v1.1: 缓存搜索结果，供客户端排序
      let currentSort = 'default'
      let currentFilter = 'all'    // v1.3: 筛选（all/food/sight/shopping/hotel/other）
      let anchor = null          // v1.1: 距离排序锚点（行程内第一个有坐标的地点）
      let currentPage = 1        // v1.2: 分页
      let totalCount = 0         // v1.2: 高德返回总数
      let lastQuery = null       // v1.3.25: 最近一次成功搜索的快照 {q, city}——loadMore 只用快照，防改词不搜索时翻页串包
      let requestSeq = 0         // v1.2: 请求序号——取消/新请求使旧响应作废
      let addedNames = new Set() // v1.2: 行程已有地点名（刷新后标记"已在行程"）
      let pagerEl = null         // v1.3.10: pager 持久引用——innerHTML 会销毁节点，用引用避免 getElementById 返回 null

      trek.onContext((ctx) => {
        const tid = ctx && ctx.tripId ? String(ctx.tripId) : null
        // v1.3.6: 主题/外观切换也会收到新 context——tripId 没变就不重载列表（否则整列表闪烁重建）
        if (tid === lastTripId) return
        lastTripId = tid
        tripId = tid
        if (tripId) { loadAnchor(); loadCity(); loadTripPlaces() }
      })

      // v1.2: 拉取行程已有地点名，刷新后标记"已在行程"，避免重复添加
      async function loadTripPlaces() {
        if (!tripId) return
        try {
          const res = await trek.invoke('/trip-places?tripId=' + encodeURIComponent(tripId))
          addedNames = new Set(((res && res.ok && res.places) || []).map(p => p.name))
          if (currentPois.length) renderResults(visiblePois())
        } catch (e) { /* 忽略 */ }
      }

      // v1.1.5: 自动识别行程城市（标题→地点坐标→地址），填入城市输入框（用户可改）
      async function loadCity() {
        const cityInput = document.getElementById('city')
        const tag = document.getElementById('city-auto-tag')
        if (!cityInput || !tripId) return
        try {
          const res = await trek.invoke('/trip-city?tripId=' + encodeURIComponent(tripId))
          if (res && res.ok && res.city) {
            cityInput.value = res.city
            cityInput.placeholder = res.city + '（自动识别，可修改）'
            // v1.3.9: ✨ 自动识别标签持续可见（直到用户手动修改）
            if (tag) { tag.style.display = ''; tag.dataset.auto = '1' }
          } else {
            cityInput.placeholder = '未识别到城市，可手动填写'
            if (tag) tag.style.display = 'none'
          }
        } catch (e) { /* 忽略，保持现状 */ }
        // v1.3.1: 识别到城市时给一次轻提示（审查 3.5）——v1.3.9: ✨ 标签为主，toast 保留首次提醒
        if (cityInput.dataset.notified !== '1' && cityInput.value) {
          cityInput.dataset.notified = '1'
          try { trek.notify('info', '已自动识别城市：' + cityInput.value + '，如不正确请更改') } catch (e) {}
        }
      }

      // v1.3.9: 用户手动修改城市 → 隐藏 ✨ 自动识别标签（不再是自动识别的值）
      function bindCityAutoTag() {
        const cityInput = document.getElementById('city')
        if (!cityInput) return
        cityInput.addEventListener('input', () => {
          const tag = document.getElementById('city-auto-tag')
          if (tag) { tag.style.display = 'none'; tag.dataset.auto = '0' }
        })
      }
      bindCityAutoTag()

      // v1.1: 拉取行程锚点（第一个有坐标的地点）——距离排序已屏蔽，保留供 README 待办方案确认后启用
      async function loadAnchor() {
        if (!tripId) { anchor = null; return }
        try {
          const res = await trek.invoke('/trip-anchor?tripId=' + encodeURIComponent(tripId))
          anchor = res && res.ok ? res.anchor : null
        } catch (e) { anchor = null }
      }

      async function refreshKeyHint(hide) {
        const hint = document.getElementById('key-hint')
        if (!hint) return
        if (hide) { hint.style.display = 'none'; return }
        try {
          const data = await trek.invoke('/key-status')
          hint.style.display = (data && data.hasKey) ? 'none' : 'block'
        } catch (e) { hint.style.display = 'block' }
      }
      refreshKeyHint()

      // v1.3.29: 首次打开引导——Key 前置（申请+填写位置）+ 三步使用法（用户反馈：没写 Key 在哪申请/在哪填）
      function showWelcomeGuide() {
        const box = document.getElementById('results-list')
        if (!box || currentPois.length) return
        box.innerHTML = `
          <div style="text-align:center; padding:32px 16px">
            <div style="font-size:40px; margin-bottom:10px">🗺️</div>
            <div style="font-size:14px; font-weight:600; margin-bottom:12px">三步用起来</div>
            <div style="text-align:left; max-width:300px; margin:0 auto; font-size:12px; line-height:1.8; opacity:0.85">
              <div style="display:flex; gap:8px; align-items:flex-start; background:rgba(250,204,21,0.12); border:1px solid rgba(250,204,21,0.35); border-radius:8px; padding:8px 10px; margin-bottom:10px"><span style="flex:none">🔑</span><span><b>先填 Key</b>：TREK <b>设置 → 插件 → 找地方</b> → 填「高德 Web 服务 Key」<br>还没 Key？<a href="https://console.amap.com/" target="_blank" rel="noopener" style="color:var(--trek-info,#2563eb)">console.amap.com</a> 免费申请，类型选「Web 服务」</span></div>
              <div style="display:flex; gap:8px; align-items:flex-start"><span style="flex:none">1️⃣</span><span>打开任意行程 → 顶部 tab「找地方」（就是本页）</span></div>
              <div style="display:flex; gap:8px; align-items:flex-start"><span style="flex:none">2️⃣</span><span>输入关键词（如：故宫/长城/西湖），城市自动识别可改</span></div>
              <div style="display:flex; gap:8px; align-items:flex-start"><span style="flex:none">3️⃣</span><span>一键复制地址，或添加进当前行程（坐标/地图链接/电话自动带上）</span></div>
            </div>
            <div style="font-size:11px; opacity:0.55; margin-top:14px">💡 在上方输入框输入地点关键词，点「搜索」开始</div>
          </div>`
      }
      showWelcomeGuide()

      function fullAddress(p) {
        return [p.pname, p.cityname, p.adname, p.address].filter(Boolean).join('')
      }

      // v1.1: 类型解析——type 形如 "餐饮服务;咖啡厅;咖啡厅"，取最后一个作为小类
      function typeClass(p) {
        if (!p.type) return ''
        const parts = p.type.split(';').filter(Boolean)
        return parts[parts.length - 1] || ''
      }

      // v1.1: 评分/人均显示（高德可能返回数组/空值，统一容错）
      function ratingText(p) {
        const r = Number(p.rating)
        return Number.isFinite(r) && r > 0 ? String(r) : ''
      }
      function costText(p) {
        const c = Number(p.cost)
        return Number.isFinite(c) && c > 0 ? '¥' + c : ''
      }
      // v1.1: 营业时间——高德 opentime2 可能是数组或字符串，先归一到字符串；v1.3.18: 去掉 24 字符截断，完整显示第一段（多段只提示数量防卡片爆炸）
      function openTimeText(p) {
        if (!p.opentime) return ''
        const raw = Array.isArray(p.opentime) ? p.opentime.join('；') : String(p.opentime)
        const segs = raw.split(/[；;]/).map(s => s.trim()).filter(Boolean)
        if (!segs.length) return ''
        return segs.length === 1 ? segs[0] : segs[0] + ' 等' + segs.length + '段'
      }

      // v1.1: 两点距离（km，Haversine）
      function distanceKm(lat1, lng1, lat2, lng2) {
        const R = 6371
        const dLat = (lat2 - lat1) * Math.PI / 180
        const dLng = (lng2 - lng1) * Math.PI / 180
        const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))
      }
      function poiDistKm(p) {
        if (!anchor || !p.location) return null
        const [lng, lat] = String(p.location).split(',').map(Number)
        if (!Number.isFinite(lat) || !Number.isFinite(lng)) return null
        return distanceKm(anchor.lat, anchor.lng, lat, lng)
      }

      // v1.3: 筛选匹配（基于高德 type 大类）
      function filterMatch(type, filter) {
        const t = type || ''
        const m = {
          food: /餐饮|美食|咖啡|餐厅|小吃|甜品|酒吧/,
          sight: /风景名胜|公园|博物馆|名胜|景点|展馆/,
          shopping: /购物|商场|超市|市场|专卖/,
          hotel: /住宿|酒店|宾馆|旅馆|民宿/,
        }
        if (filter === 'all') return true
        if (filter === 'other') {
          return !m.food.test(t) && !m.sight.test(t) && !m.shopping.test(t) && !m.hotel.test(t)
        }
        return (m[filter] || /^$/).test(t)
      }

      // v1.3: 可见结果 = 筛选 + 排序（替代原 sortedPois）
      function visiblePois() {
        const arr = (currentFilter === 'all'
          ? currentPois.slice()
          : currentPois.filter(p => filterMatch(p.type, currentFilter))).slice()
        if (currentSort === 'rating') {
          arr.sort((a, b) => (Number(b.rating) || 0) - (Number(a.rating) || 0))
        } else if (currentSort === 'cost') {
          arr.sort((a, b) => (Number(a.cost) || 0) - (Number(b.cost) || 0))
        } else if (currentSort === 'distance') {
          arr.sort((a, b) => (poiDistKm(a) ?? 99999) - (poiDistKm(b) ?? 99999))
        }
        return arr
      }

      async function copyText(text) {
        try {
          await navigator.clipboard.writeText(text)
          trek.notify('success', '已复制：' + text.slice(0, 30) + (text.length > 30 ? '…' : ''))
        } catch (e) {
          const ta = document.createElement('textarea')
          ta.value = text
          document.body.appendChild(ta)
          ta.select()
          document.execCommand('copy')
          document.body.removeChild(ta)
          trek.notify('success', '已复制')
        }
      }

      // v1.1.8: Lucide 图标（与 TREK 设计语言对齐，ISC 许可内联 SVG）
      const ICON_COPY = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>'
      const ICON_ADD = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>'
      // v1.3.20: 搜索按钮放大镜（移动端 icon-only）
      const ICON_SEARCH = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>'
      // v1.3.24: 信息行 lucide 图标（官方定义，统一尺寸由 .poi-info-icon svg 控制）
      const ICON_MAP_PIN = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>'
      const ICON_PHONE = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2a9 9 0 0 1 9 9"/><path d="M13 6a5 5 0 0 1 5 5"/><path d="M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384"/></svg>'
      const ICON_CLOCK = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6v6l2 1"/><path d="M13.5 21.885A10 10 0 1 1 22 12"/><path d="M14 18h8"/><path d="m18 22 4-4-4-4"/></svg>'
      // v1.2: 按钮状态图标——添加中转圈 loader（lucide loader）/ 已添加打勾 check（lucide check）
      const ICON_LOADER = '<svg class="trek-spin" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4"/><path d="m16.2 7.8 2.9-2.9"/><path d="M18 12h4"/><path d="m16.2 16.2 2.9 2.9"/><path d="M12 18v4"/><path d="m4.9 19.1 2.9-2.9"/><path d="M2 12h4"/><path d="m4.9 4.9 2.9 2.9"/></svg>'
      const ICON_CHECK = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'

      // v1.3.15: 单卡片 HTML（供全量渲染 + loadMore 增量追加复用）
      function poiCardHtml(p, i) {
        const addr = fullAddress(p)
        const photo = p.photos && p.photos[0]
        const typeCls = typeClass(p)
        const rating = ratingText(p)
        const cost = costText(p)
        const open = openTimeText(p)
        // v1.3.17: 信息过载优化——距离不再显示（锚点依赖行程已有地点，很多行程没有）；评分/人均上移名称行右侧（决策信息分层）；营业时间独立一行
        return `
          <div class="trek-card poi-card" style="padding:10px 12px; margin-bottom:8px">
            <div class="poi-thumb">
              ${photo ? `<img src="${esc(photo)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.innerHTML='${emojiFor(typeCls)}'" />` : emojiFor(typeCls)}
            </div>
            <div style="flex:1; min-width:0">
              <div class="poi-name" style="display:flex; align-items:center; gap:6px; flex-wrap:wrap">
                <span>${esc(p.name)}</span>
                ${typeCls ? `<span class="poi-tag">${esc(typeCls)}</span>` : ''}
                ${p.keytag ? `<span class="poi-tag">${esc(p.keytag)}</span>` : ''}
                <span style="margin-left:auto; flex:none; display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--text-secondary)">
                  ${rating ? `<span class="poi-rating">⭐ ${esc(rating)}</span>` : ''}
                  ${cost ? `<span>${esc(cost)}</span>` : ''}
                </span>
              </div>
              <div style="display:flex; align-items:center; gap:5px; font-size:12px; opacity:0.7; margin-top:2px"><span class="poi-info-icon">${ICON_MAP_PIN}</span><span>${esc(addr)}</span></div>
              ${p.tel ? `<div style="display:flex; align-items:center; gap:5px; font-size:12px; opacity:0.7; margin-top:1px"><span class="poi-info-icon">${ICON_PHONE}</span><span>${esc(p.tel)}</span></div>` : ''}
              ${open ? `<div style="display:flex; align-items:center; gap:5px; font-size:12px; opacity:0.7; margin-top:1px"><span class="poi-info-icon">${ICON_CLOCK}</span><span>${esc(open)}</span></div>` : ''}
            </div>
            <div class="poi-actions">
              <button class="trek-btn trek-btn--secondary" data-copy="${i}" title="复制地址" aria-label="复制地址"><span class="btn-icon">${ICON_COPY}</span><span class="btn-label">复制地址</span></button>
              ${addedNames.has(p.name)
                ? `<button class="trek-btn trek-btn--primary" disabled style="opacity:0.6" title="已在行程中" aria-label="已在行程中"><span class="btn-icon">${ICON_CHECK}</span><span class="btn-label">已在行程</span></button>`
                : `<button class="trek-btn trek-btn--primary" data-add="${i}" title="添加进行程" aria-label="添加进行程"><span class="btn-icon">${ICON_ADD}</span><span class="btn-label">添加进行程</span></button>`}
            </div>
          </div>
        `
      }

      let renderedPois = []  // v1.3.15: 当前展示数据（事件委托取数）

      // v1.3.15: 事件委托——复制/添加按钮在容器上只绑一次，loadMore 增量追加后无需重绑
      function bindPoiEvents(box) {
        if (box.dataset.bound) return
        box.dataset.bound = '1'
        box.addEventListener('click', async (e) => {
          const copyBtn = e.target.closest('button[data-copy]')
          if (copyBtn) {
            const p = renderedPois[Number(copyBtn.dataset.copy)]
            if (!p) return
            const addr = fullAddress(p)
            const amapLink = p.id ? `https://www.amap.com/place/${p.id}` : ''
            const text = `${p.name}\n${addr}\n经纬度: ${p.location || '无'}${amapLink ? '\n地图: ' + amapLink : ''}\n类型: ${p.type || ''}${p.tel ? '\n电话: ' + p.tel : ''}${p.rating ? '\n评分: ' + p.rating : ''}${p.cost ? '\n人均: ¥' + p.cost : ''}`
            copyText(text)
            return
          }
          const addBtn = e.target.closest('button[data-add]')
          if (addBtn) {
            const poi = renderedPois[Number(addBtn.dataset.add)]
            if (!poi) return
            if (!tripId) { trek.notify('error', '未检测到当前行程'); return }
            addBtn.disabled = true; addBtn.innerHTML = `<span class="btn-icon">${ICON_LOADER}</span><span class="btn-label">添加中</span>`; addBtn.setAttribute('aria-label', '添加中')
            try {
              const res = await trek.invoke('/add', {
                method: 'POST',
                body: JSON.stringify({ tripId: Number(tripId), place: poi }),
              })
              if (res.ok) {
                trek.notify('success', `已添加「${poi.name}」到行程`)
                addedNames.add(poi.name)
                addBtn.innerHTML = `<span class="btn-icon">${ICON_CHECK}</span><span class="btn-label">已添加</span>`
                addBtn.setAttribute('aria-label', '已添加')
                addBtn.style.opacity = '0.6'
              } else {
                trek.notify('error', res.error || '添加失败')
                addBtn.disabled = false; addBtn.innerHTML = `<span class="btn-icon">${ICON_ADD}</span><span class="btn-label">添加进行程</span>`; addBtn.setAttribute('aria-label', '添加进行程')
              }
            } catch (err) {
              trek.notify('error', '请求失败: ' + err.message)
              addBtn.disabled = false; addBtn.innerHTML = `<span class="btn-icon">${ICON_ADD}</span><span class="btn-label">添加进行程</span>`; addBtn.setAttribute('aria-label', '添加进行程')
            }
          }
        })
      }

      // v1.1: 渲染结果（含排序后）——v1.3.10: 操作 #results-list（pager 是 #results 静态子元素，不再被 innerHTML 销毁）
      // v1.3.15: 空状态美化 + 事件委托
      function renderResults(pois) {
        const box = document.getElementById('results-list')
        box.classList.add('trek-stagger')
        renderedPois = pois || []
        if (!renderedPois.length) {
          showEmptyState()
          return
        }
        box.innerHTML = renderedPois.map((p, i) => poiCardHtml(p, i)).join('')
        bindPoiEvents(box)
      }

      // v1.3.15: 空状态——🔍 大图标 + 友好文案 + 操作按钮（清除筛选/换个关键词/手动选择城市）
      function showEmptyState() {
        const box = document.getElementById('results-list')
        // v1.3.25: 空态必须隐藏 pager（筛选后 0 匹配走这里时 pager 残留会自相矛盾）
        document.getElementById('pager').style.display = 'none'
        const cityVal = document.getElementById('city').value.trim()
        const filterActive = currentFilter !== 'all' || currentSort !== 'default'
        const btns = []
        if (filterActive) btns.push('<button class="trek-btn trek-btn--secondary" id="btn-clear-filter">清除筛选</button>')
        btns.push('<button class="trek-btn trek-btn--secondary" id="btn-new-keyword">换个关键词</button>')
        if (!cityVal) btns.push('<button class="trek-btn trek-btn--primary" id="btn-pick-city">手动选择城市</button>')
        box.innerHTML = `
          <div style="text-align:center; padding:36px 16px">
            <div style="font-size:44px; margin-bottom:10px">🔍</div>
            <div style="font-size:14px; font-weight:600; margin-bottom:4px">没找到相关地点</div>
            <!-- v1.3.25: 文案条件修复——filterActive 时提示清筛选（原错误绑定 cityVal，筛选激活但城市为空时不提示） -->
            <div style="font-size:12px; opacity:0.65; margin-bottom:14px">试试换个关键词${filterActive ? '，或清除筛选' : (!cityVal ? '，或手动填写城市' : '')}</div>
            <div style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap">${btns.join('')}</div>
          </div>`
        const clearBtn = document.getElementById('btn-clear-filter')
        if (clearBtn) clearBtn.addEventListener('click', () => {
          currentFilter = 'all'; document.getElementById('filter-select').value = 'all'
          currentSort = 'default'; document.getElementById('sort-select').value = 'default'
          renderResults(visiblePois())
        })
        const kwBtn = document.getElementById('btn-new-keyword')
        if (kwBtn) kwBtn.addEventListener('click', () => { document.getElementById('q').value = ''; document.getElementById('q').focus() })
        const pickBtn = document.getElementById('btn-pick-city')
        if (pickBtn) pickBtn.addEventListener('click', () => { document.getElementById('city').focus(); document.getElementById('city').select() })
      }

      // v1.3.25: HTML 转义——POI 字段来自高德 API，防异常店名破坏卡片结构/注入
      function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) }

      // v1.1: 类型小类 → emoji 占位图（无缩略图时）
      function emojiFor(typeCls) {
        const map = {
          '咖啡厅': '☕', '咖啡': '☕', '餐厅': '🍜', '中餐厅': '🍜', '火锅': '🍲',
          '酒店': '🏨', '宾馆': '🏨', '景点': '🏛️', '博物馆': '🏛️', '公园': '🌳',
          '购物': '🛍️', '商场': '🛍️', '超市': '🛒', '便利店': '🏪',
          '酒吧': '🍸', 'KTV': '🎤', '电影院': '🎬', '书店': '📚', '图书馆': '📚',
        }
        for (const [k, v] of Object.entries(map)) {
          if (typeCls && typeCls.includes(k)) return v
        }
        return '📍'
      }

      // v1.2: 骨架屏——官方 .trek-skeleton 类（shimmer 动画，深浅色自适应 + reduce-motion 降级）
      function showSkeleton(box) {
        box.innerHTML = Array.from({ length: 4 }, () => `
          <div class="trek-card poi-card" style="padding:10px 12px; margin-bottom:8px">
            <div class="poi-thumb trek-skeleton" style="border:none"></div>
            <div style="flex:1; min-width:0">
              <div class="trek-skeleton" style="height:14px; width:60%; margin-bottom:8px"></div>
              <div class="trek-skeleton" style="height:12px; width:80%; margin-bottom:6px"></div>
              <div class="trek-skeleton" style="height:12px; width:50%"></div>
            </div>
          </div>`).join('')
      }

      // v1.2: 分页信息 + 加载更多按钮显隐
      function updatePager() {
        const pager = document.getElementById('pager')   // v1.3.10: pager 是静态子元素，永远存在
        const info = document.getElementById('pager-info')
        const more = document.getElementById('btn-more')
        const loaded = currentPois.length
        pager.style.display = 'block'
        if (totalCount > loaded) {
          info.textContent = `已加载 ${loaded} / ${totalCount} 条`
          more.style.display = ''
          more.disabled = false
          more.innerHTML = '加载更多'
        } else {
          info.textContent = `共 ${loaded} 条`
          more.style.display = 'none'
        }
      }

      // v1.3.15: 错误状态——红字 + 重试按钮（直接调 doSearch()）
      function showErrorState(msg) {
        const box = document.getElementById('results-list')
        box.innerHTML = `<div style="text-align:center; padding:36px 16px">
          <div style="font-size:40px; margin-bottom:10px">😵</div>
          <div style="color:var(--trek-danger,#ef4444); margin-bottom:14px">${msg}</div>
          <button class="trek-btn trek-btn--primary" id="btn-retry">重试</button>
        </div>`
        const retry = document.getElementById('btn-retry')
        if (retry) retry.addEventListener('click', () => doSearch())
      }

      // v1.2: 加载下一页并追加——v1.3.25: 用 lastQuery 快照（doSearch 成功时更新），改词不搜索时翻页仍是旧查询，防串包
      async function loadMore() {
        const q = lastQuery ? lastQuery.q : ''
        const city = lastQuery ? lastQuery.city : ''
        const more = document.getElementById('btn-more')
        const box = document.getElementById('results-list')
        const seq = requestSeq
        if (!q) return
        currentPage++
        more.disabled = true
        more.innerHTML = `<span class="btn-icon">${ICON_LOADER}</span><span class="btn-label">加载中</span>`
        try {
          const url = '/search?q=' + encodeURIComponent(q) + (city ? '&city=' + encodeURIComponent(city) : '') + '&page=' + currentPage
          const data = await trek.invoke(url)
          if (seq !== requestSeq) return
          if (!data.ok) { trek.notify('error', data.error || '加载失败'); currentPage--; return }
          const newPois = data.pois || []
          currentPois = currentPois.concat(newPois)
          // v1.3.15: 增量追加——默认视图直接 append 新卡片（事件委托已绑无需重绑），不再整页重建；筛选/排序激活时顺序会变，走全量重建
          if (currentSort === 'default' && currentFilter === 'all') {
            renderedPois = currentPois   // 默认视图展示数据 = 全量缓存
            const prevLen = currentPois.length - newPois.length
            box.insertAdjacentHTML('beforeend', newPois.map((p, j) => poiCardHtml(p, prevLen + j)).join(''))
          } else {
            renderResults(visiblePois())
          }
          updatePager()
        } catch (e) {
          if (seq !== requestSeq) return
          trek.notify('error', '请求异常: ' + e.message)
          currentPage--
        } finally {
          if (seq === requestSeq) { more.disabled = false; more.innerHTML = '加载更多' }
        }
      }

      async function doSearch() {
        const q = document.getElementById('q').value.trim()
        const city = document.getElementById('city').value.trim()
        if (!q) { trek.notify('warning', '请输入关键词'); return }
        const box = document.getElementById('results-list')   // v1.3.10: 重建区 = results-list（pager 是 #results 静态子元素，不受影响）
        const btn = document.getElementById('btn-search')
        const seq = ++requestSeq
        currentPage = 1
        // v1.3.1: 加载反馈——按钮只显示转圈 icon + 轻提示 + 骨架屏（取消按钮已移除）
        btn.disabled = true
        btn.innerHTML = `<span class="btn-icon">${ICON_LOADER}</span>`
        trek.notify('info', '搜索中…')
        showSkeleton(box)
        try {
          const url = '/search?q=' + encodeURIComponent(q) + (city ? '&city=' + encodeURIComponent(city) : '') + '&page=' + currentPage
          const data = await trek.invoke(url)
          if (seq !== requestSeq) return
          if (!data.ok) {
            if (/key|Key|key/i.test(data.error || '')) { refreshKeyHint(false) }
            // v1.3.15: 错误状态加重试按钮
            showErrorState(data.error || '搜索失败')
            return
          }
          refreshKeyHint(true)
          // 先更新缓存再判空：防止“无结果”时排序下拉渲染上一次的结果
          currentPois = data.pois || []
          totalCount = Number(data.count) || 0
          // v1.3.25: 成功搜索才更新快照（loadMore 用）——输入框后续改动不影响翻页查询
          lastQuery = { q, city }
          // v1.3.9: 不重置筛选/排序——用户偏好持续（换关键词搜索仍保留“只看餐饮+按评分”）
          if (currentPois.length === 0) {
            // v1.3.9: 空状态保留筛选/排序可见（用户知道有这功能，不再隐身）
            showEmptyState()  // v1.3.25: showEmptyState 内已统一隐藏 pager，此分支不再单独处理
            return
          }
          // v1.3.9: filter-sort-row 初始即可见，无需再设 display
          // v1.3.3: 刷新行程地点列表——以行程真实数据为准（防止计划页删除后仍显示"已在行程"）
          await loadTripPlaces()
          renderResults(visiblePois())
          updatePager()
        } catch (e) {
          if (seq !== requestSeq) return
          // v1.3.15: 错误状态加重试按钮
          showErrorState('请求异常: ' + e.message)
        } finally {
          if (seq === requestSeq) {
            btn.disabled = false
            btn.innerHTML = `<span class="btn-icon">${ICON_SEARCH}</span><span class="btn-label">搜索</span>`
          }
        }
      }

      // v1.3.2: 排序下拉（客户端排序）
      document.getElementById('sort-select').addEventListener('change', (e) => {
        currentSort = e.target.value
        renderResults(visiblePois())
      })

      // v1.3.2: 筛选下拉（客户端筛选，无需重新请求）
      document.getElementById('filter-select').addEventListener('change', (e) => {
        currentFilter = e.target.value
        renderResults(visiblePois())
      })

      document.getElementById('btn-search').addEventListener('click', doSearch)
      document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch() })
      // v1.3.25: 城市框 Enter 同样触发搜索（填完城市回车是自然预期）
      document.getElementById('city').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch() })
      // v1.2: 加载更多（分页）
      document.getElementById('btn-more').addEventListener('click', loadMore)

      // v1.4.0: 坐标修复——扫描行程已有地点，逐个用地点名重新搜索高德比对新旧坐标，预览后确认写入
      let coordFixResults = []  // 最近一次 /coord-scan 结果，供"应用所选"读取
      let coordScanSeq = 0      // 独立请求序号（不与搜索共用 requestSeq）——面板重开/关闭时使旧扫描循环作废
      const coordFixPanel = document.getElementById('coord-fix-panel')
      const coordFixBody = document.getElementById('coord-fix-body')

      function coordFixRowHtml(r, i) {
        const isNew = r.oldLat === null
        const distText = isNew ? '暂无坐标' : `偏移 ${r.distanceM}m`
        const confidenceTag = r.nameMatch === 'exact' ? '' : (r.nameMatch === 'partial' ? '<span class="poi-tag" title="高德匹配名称仅部分一致">⚠️ 名称部分匹配</span>' : '<span class="poi-tag" title="高德匹配名称差异较大——应用前请仔细核对">❓ 低置信度</span>')
        const checked = r.nameMatch !== 'low' ? 'checked' : ''
        return `
          <label style="display:flex; gap:8px; align-items:flex-start; padding:8px 0; border-top:1px solid var(--trek-border, rgba(128,128,128,0.15))">
            <input type="checkbox" data-fix-idx="${i}" ${checked} style="margin-top:3px" />
            <span style="flex:1; min-width:0">
              <div style="font-weight:600; display:flex; gap:6px; align-items:center; flex-wrap:wrap">${esc(r.name)}${confidenceTag}</div>
              <div style="opacity:0.7; margin-top:2px">${isNew ? '' : `旧: ${r.oldLat.toFixed(6)}, ${r.oldLng.toFixed(6)} → `}新: ${r.newLat.toFixed(6)}, ${r.newLng.toFixed(6)} <span style="opacity:0.8">(${distText})</span></div>
              <div style="opacity:0.6; margin-top:2px">高德匹配: ${esc(r.candidateName)}${r.candidateAddress ? ' — ' + esc(r.candidateAddress) : ''}</div>
            </span>
          </label>`
      }

      function renderCoordFixResults() {
        if (!coordFixResults.length) {
          coordFixBody.innerHTML = `<div style="opacity:0.7; padding:8px 0">✅ 所有已检查地点与高德一致，无需修复</div>`
          return
        }
        coordFixBody.innerHTML = `
          <div style="opacity:0.75; margin-bottom:4px">发现 ${coordFixResults.length} 个地点坐标可能偏移。应用前请核对——名称匹配不确定的默认不勾选</div>
          <div id="coord-fix-list">${coordFixResults.map(coordFixRowHtml).join('')}</div>
          <div style="display:flex; gap:8px; margin-top:10px">
            <button id="coord-fix-apply" class="trek-btn trek-btn--primary" style="flex:1">应用所选</button>
          </div>`
        const applyBtn = document.getElementById('coord-fix-apply')
        applyBtn.addEventListener('click', async () => {
          const checked = Array.from(document.querySelectorAll('#coord-fix-list input[type=checkbox]:checked'))
            .map(cb => coordFixResults[Number(cb.dataset.fixIdx)])
          if (!checked.length) { trek.notify('warning', '请至少选择一个地点'); return }
          applyBtn.disabled = true
          applyBtn.innerHTML = `<span class="btn-icon">${ICON_LOADER}</span><span class="btn-label">应用中</span>`
          try {
            const res = await trek.invoke('/coord-fix', {
              method: 'POST',
              body: JSON.stringify({
                tripId: Number(tripId),
                fixes: checked.map(r => ({ id: r.id, lat: r.newLat, lng: r.newLng })),
              }),
            })
            if (res.ok) {
              trek.notify('success', `已修复 ${res.updated} 个地点`)
              if (res.errors && res.errors.length) trek.notify('warning', `${res.errors.length} 个地点更新失败`)
              coordFixResults = coordFixResults.filter(r => !checked.includes(r))
              renderCoordFixResults()
            } else {
              trek.notify('error', res.error || '应用失败')
              applyBtn.disabled = false
              applyBtn.innerHTML = '应用所选'
            }
          } catch (e) {
            trek.notify('error', '请求失败: ' + e.message)
            applyBtn.disabled = false
            applyBtn.innerHTML = '应用所选'
          }
        })
      }

      // v1.4.0: 批大小（并发数）由服务端按设置里的 coord_scan_concurrency 决定，客户端顺着 nextOffset 循环拉批次
      async function openCoordFix() {
        if (!tripId) { trek.notify('error', '未检测到当前行程'); return }
        const seq = ++coordScanSeq
        coordFixPanel.style.display = 'block'
        coordFixResults = []
        let offset = 0
        let total = null
        let cityParam = null   // 第一批探测到的城市，后续批次原样带回，服务端不再重新探测
        try {
          while (true) {
            coordFixBody.innerHTML = `<div style="display:flex; align-items:center; gap:8px; padding:8px 0"><span class="btn-icon">${ICON_LOADER}</span> 正在扫描行程地点… ${total !== null ? `(${Math.min(offset, total)}/${total})` : ''}</div>`
            let url = '/coord-scan?tripId=' + encodeURIComponent(tripId) + '&offset=' + offset
            if (offset > 0) url += '&city=' + encodeURIComponent(cityParam || '')
            const res = await trek.invoke(url)
            if (seq !== coordScanSeq) return  // 面板被关闭/重新打开，旧扫描作废
            if (!res.ok) {
              coordFixBody.innerHTML = `<div style="color:var(--trek-danger,#ef4444)">${esc(res.error || '扫描失败')}</div>`
              return
            }
            total = res.total
            if (offset === 0) cityParam = res.city
            coordFixResults = coordFixResults.concat(res.results || [])
            if (res.nextOffset === null || res.nextOffset === undefined) break
            offset = res.nextOffset
          }
          renderCoordFixResults()
        } catch (e) {
          if (seq !== coordScanSeq) return
          coordFixBody.innerHTML = `<div style="color:var(--trek-danger,#ef4444)">请求错误: ${esc(e.message)}</div>`
        }
      }
      document.getElementById('btn-coord-fix').addEventListener('click', openCoordFix)
      document.getElementById('coord-fix-close').addEventListener('click', () => { coordScanSeq++; coordFixPanel.style.display = 'none' })
    </script>
  </body>
</html>
